name: Engineering quality

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: eng-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (errors must be zero)
        run: npm run lint
      - name: Unit tests
        run: npm test
